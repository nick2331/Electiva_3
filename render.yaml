services:
  # ─── Backend FastAPI (Python nativo) ────────────────────────────
  - type: web
    name: vehicleye-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vehicleye-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://vehicleye.onrender.com","https://vehicleye-api.onrender.com","http://localhost:5173"]'
      - key: MODEL_DOWNLOAD_URL
        value: ''
      - key: PYTHON_VERSION
        value: '3.11.0'

  # ─── Frontend React (Static Site) ───────────────────────────────
  - type: web
    name: vehicleye
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://vehicleye-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: vehicleye-db
    plan: free
    databaseName: vehicleye
